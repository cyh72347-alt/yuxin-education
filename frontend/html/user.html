<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - 余馨教育</title>
    <!-- Bootstrap CSS -->
    <link href="/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/YuXin05.css">
    <link rel="stylesheet" href="/css/user.css">
    <link rel="stylesheet" href="/css/tool.css">
</head>

<body>
    <!-- Bootstrap导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark"
        style="background-color: #FD8291; border-bottom: 30px solid #ece9e9;">
        <div class="container-fluid">
            <!-- Logo -->
            <a class="navbar-brand" href="/index.html">
                <img src="/images/YuXinjiaoyu.png" alt="余馨教育" class="logo-img" style="height: 60px;">
            </a>

            <!-- 移动端汉堡菜单按钮 -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="切换导航">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- 导航内容 -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="introduction.html">教育介绍</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">课程设置</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="team.html">师资团队</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">招生问答</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">教学活动</a>
                    </li>
                </ul>

                <!-- 用户信息区域 -->
                <div class="nav-right" id="navUserInfo">
                    <!-- 这里会被auth.js自动更新 -->
                </div>
            </div>
        </div>
    </nav>

    <!-- 个人主页内容 -->
    <div class="container mt-5">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-lg-3 col-md-4 mb-4">
                <div class="card user-sidebar shadow-sm">
                    <div class="card-body text-center">
                        <div class="user-avatar mb-3">
                            👤
                        </div>
                        <h4 class="user-name" id="userName">加载中...</h4>
                        <p class="user-email text-muted" id="userEmail">--</p>

                        <div class="list-group user-nav mt-4">
                            <a href="#profile" class="list-group-item list-group-item-action active">个人信息</a>
                            <a href="#courses" class="list-group-item list-group-item-action">我的课程</a>
                            <a href="#progress" class="list-group-item list-group-item-action">学习进度</a>
                            <a href="#settings" class="list-group-item list-group-item-action">账号设置</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="col-lg-9 col-md-8">
                <div class="card user-main shadow-sm">
                    <div class="card-body">
                        <!-- 个人信息 -->
                        <section id="profile" class="user-section">
                            <h3 class="mb-4 border-bottom pb-2">个人信息</h3>
                            <div class="info-grid" id="userInfoGrid">
                                <!-- 动态加载用户信息 -->
                            </div>
                        </section>

                        <!-- 我的课程 -->
                        <section id="courses" class="user-section mt-5">
                            <h3 class="mb-4 border-bottom pb-2">我的课程</h3>
                            <div class="row" id="courseList">
                                <!-- 动态加载课程 -->
                            </div>
                        </section>

                        <!-- 学习进度 -->
                        <section id="progress" class="user-section mt-5">
                            <h3 class="mb-4 border-bottom pb-2">学习统计</h3>
                            <div id="progressStats">
                                <!-- 学习统计 -->
                                <p class="text-muted">暂无学习数据</p>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <button class="back-to-top" id="backToTop">
        <svg width="24" height="24" viewBox="0 0 24 24">
            <path fill="white" d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z" />
        </svg>
    </button>

    <!-- Bootstrap JS -->
    <script src="/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入认证和用户管理脚本 -->
     <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
     <script src="/js/supabase-config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/user.js"></script>
    <script src="/js/tool.js"></script>

    <script>
        // 页面加载时检查登录状态
        document.addEventListener('DOMContentLoaded', () => {
            // 检查是否登录
            if (!auth.requireLogin()) {
                return;
            }

            // 加载用户信息
            loadUserProfile();

            // 设置导航栏活动状态
            setupUserNav();
        });
    </script>
</body>

</html>
